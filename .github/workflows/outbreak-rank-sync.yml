OUTBREAK Rank Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
      MYSQL_USER: ${{ secrets.MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
      RANK_SYNC_TOKEN: ${{ secrets.RANK_SYNC_TOKEN }}
      RANK_ENDPOINT: https://iiavzxgblffistgpitne.supabase.co/functions/v1/outbreak-rank

    steps:
      - name: Instalar conector MariaDB
        run: npm install --no-audit --no-fund mariadb@3.5.2

      - name: Sincronizar TOP 5
        run: |
          node <<'JS'
          const mariadb = require('mariadb');

          async function sync() {
            let db;
            try {
              db = await mariadb.createConnection({
                host: process.env.MYSQL_HOST,
                port: 3306,
                user: process.env.MYSQL_USER,
                password: process.env.MYSQL_PASSWORD,
                database: process.env.MYSQL_DATABASE,
                ssl: true,
                connectTimeout: 15000
              });

              console.log('MariaDB conectado');

              const rows = await db.query(`
                SELECT
                  HEX(name) AS name_hex,
                  points,
                  points_survivors + points_infected AS versus,
                  (
                    points +
                    points_survivors +
                    points_infected +
                    points_realism +
                    points_survival +
                    points_scavenge_survivors +
                    points_scavenge_infected +
                    points_realism_survivors +
                    points_realism_infected +
                    points_mutations
                  ) AS total,
                  kills,
                  headshots,
                  playtime,
                  playtime_versus
                FROM players
                ORDER BY total DESC, steamid ASC
                LIMIT 5
              `);

              const players = rows.map(row =>
                Object.fromEntries(
                  Object.entries(row).map(([k,v]) => {
                    if (typeof v === 'bigint') {
                      v = Number(v);
                      if (!Number.isSafeInteger(v))
                        throw new Error('Invalid statistic');
                    }
                    return [k,v];
                  })
                )
              );

              console.log('Jugadores:', players.length);

              const response = await fetch(
                process.env.RANK_ENDPOINT,
                {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'x-rank-token': process.env.RANK_SYNC_TOKEN
                  },
                  body: JSON.stringify({players})
                }
              );

              if (!response.ok)
                throw new Error('Supabase HTTP ' + response.status);

              console.log('Supabase:', await response.text());

            } finally {
              if (db) await db.end();
            }
          }

          sync().catch(err => {
            console.error(err.code || err.message);
            process.exitCode = 1;
          });
          JS
