name: OUTBREAK Rank Sync
on:
  workflow_dispatch:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
permissions: {}
concurrency:
  group: outbreak-rank-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
      MYSQL_USER: ${{ secrets.MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
      RANK_SYNC_TOKEN: ${{ secrets.RANK_SYNC_TOKEN }}
      RANK_ENDPOINT: https://iiavzxgblffistgpitne.supabase.co/functions/v1/outbreak-rank
    steps:
      - name: Descargar conector Java
        run: curl -fsSL --max-time 60 https://repo.maven.apache.org/maven2/org/mariadb/jdbc/mariadb-java-client/4.0.0/mariadb-java-client-4.0.0.jar -o mariadb.jar
      - name: Consultar TOP 5
        run: |
          cat > RankSync.java <<'JAVA'
          import java.sql.*;
          import java.nio.file.*;
          public class RankSync {
            public static void main(String[] args) throws Exception {
              String url = "jdbc:mariadb://" +
                System.getenv("MYSQL_HOST") + ":3306/" +
                System.getenv("MYSQL_DATABASE") +
                "?sslMode=verify-full&deferCertificateValidation=true&connectTimeout=15000";
              String sql = """
                SELECT JSON_OBJECT('players',
                  COALESCE(JSON_ARRAYAGG(JSON_OBJECT(
                    'name_hex', name_hex,
                    'points', points,
                    'versus', versus,
                    'total', total,
                    'kills', kills,
                    'headshots', headshots,
                    'playtime', playtime,
                    'playtime_versus', playtime_versus
                  ) ORDER BY total DESC, steamid ASC), JSON_ARRAY()))
                FROM (
                  SELECT steamid, HEX(name) AS name_hex,
                    points,
                    points_survivors + points_infected AS versus,
                    points + points_survivors + points_infected +
                    points_realism + points_survival +
                    points_scavenge_survivors +
                    points_scavenge_infected +
                    points_realism_survivors +
                    points_realism_infected +
                    points_mutations AS total,
                    kills, headshots, playtime, playtime_versus
                  FROM players
                  ORDER BY total DESC, steamid ASC LIMIT 5
                ) AS ranked
                """;
              try (
                Connection db = DriverManager.getConnection(
                  url,
                  System.getenv("MYSQL_USER"),
                  System.getenv("MYSQL_PASSWORD")
                );
                Statement stmt = db.createStatement()
              ) {
                System.out.println("MariaDB conectado");
                try (ResultSet rs = stmt.executeQuery(sql)) {
                  if (!rs.next()) throw new SQLException("Sin datos");
                  Files.writeString(Path.of("rank.json"), rs.getString(1));
                }
                System.out.println("TOP 5 obtenido");
              }
            }
          }
          JAVA
          "$JAVA_HOME_17_X64/bin/java" -cp mariadb.jar RankSync.java
      - name: Enviar ranking a Supabase
        run: |
          set -euo pipefail
          jq -e '.players | type == "array" and length <= 5' rank.json >/dev/null
          curl -fsS --max-time 30 \
            -H "Content-Type: application/json" \
            -H "x-rank-token: $RANK_SYNC_TOKEN" \
            --data-binary @rank.json \
            "$RANK_ENDPOINT" | jq -e 'select(.ok == true)'
